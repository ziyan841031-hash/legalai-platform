spring:
  application:
    name: legalai-admin
  datasource:
    url: jdbc:postgresql://localhost:5432/legalai
    username: legalai
    password: legalai
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  issuer: legalai-platform
  secret: change-me
  expiration-seconds: 7200

token:
  issuer: legalai-platform
  secret: change-me-change-me-change-me-change-me
  access-token-seconds: 1800
  refresh-token-seconds: 2592000
